<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الشخصية | اعرفني</title>

  <link rel="stylesheet" href="style.css">
</head>

      <p id="personAchievements"></p>
    </section>

    <section>
      <h2>معرض الصور</h2>
      <div id="gallery"></div>
    </section>

    <section>
      <h2>تابعني على</h2>
      <div id="socialLinks"></div>
    </section>
  </main>

  <script src="script.js"></script>

</html>
